name: tests

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest

        env:
            APP_ENV: testing
            APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
            BROADCAST_CONNECTION: 'null'
            CACHE_STORE: array
            DB_CONNECTION: sqlite
            DB_DATABASE: ':memory:'
            MAIL_MAILER: array
            QUEUE_CONNECTION: sync
            SESSION_DRIVER: array

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.5.9'
                  extensions: bcmath, exif, gd, mbstring, pdo_sqlite
                  tools: composer:v2
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '24'
                  cache: npm

            - name: Setup npm
              run: npm install --global npm@12.0.2

            - name: Install PHP dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Install frontend dependencies
              run: npm ci --ignore-scripts

            - name: Prepare application
              run: php artisan migrate --force

            - name: Run CI checks
              run: composer ci:check

    deploy:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: ci
        runs-on: ubuntu-latest
        environment:
            name: production
            url: ${{ vars.DEPLOY_URL }}
        concurrency:
            group: production
            cancel-in-progress: false

        steps:
            - name: Checkout deployment scripts
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Configure SSH
              env:
                  DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
              run: |
                  set -Eeuo pipefail
                  : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS is required}"
                  : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required}"
                  printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/movie-quotes-deploy-key"
                  printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/movie-quotes-known-hosts"
                  chmod 600 "$RUNNER_TEMP/movie-quotes-deploy-key"

            - name: Deploy tested main commit
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
                  DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
                  DEPLOY_SHA: ${{ github.sha }}
                  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
              run: |
                  set -Eeuo pipefail
                  : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
                  : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
                  : "${DEPLOY_USER:?DEPLOY_USER is required}"
                  DEPLOY_PORT="${DEPLOY_PORT:-22}"
                  printf -v remote_command 'DEPLOY_PATH=%q DEPLOY_SHA=%q bash -s' "$DEPLOY_PATH" "$DEPLOY_SHA"
                  ssh \
                      -i "$RUNNER_TEMP/movie-quotes-deploy-key" \
                      -o BatchMode=yes \
                      -o ConnectTimeout=15 \
                      -o IdentitiesOnly=yes \
                      -o StrictHostKeyChecking=yes \
                      -o UserKnownHostsFile="$RUNNER_TEMP/movie-quotes-known-hosts" \
                      -p "$DEPLOY_PORT" \
                      "$DEPLOY_USER@$DEPLOY_HOST" \
                      "$remote_command" \
                      < scripts/deploy.sh

            - name: Check production health
              env:
                  DEPLOY_URL: ${{ vars.DEPLOY_URL }}
              run: |
                  set -Eeuo pipefail
                  : "${DEPLOY_URL:?DEPLOY_URL is required}"
                  curl \
                      --connect-timeout 10 \
                      --fail \
                      --location \
                      --max-time 30 \
                      --retry 5 \
                      --retry-all-errors \
                      --retry-delay 5 \
                      --show-error \
                      --silent \
                      "${DEPLOY_URL%/}/up"
